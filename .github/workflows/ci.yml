name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Node 24, matching the machine the lockfile is written on. A lockfile
          # written by npm 11 omits hoisted entries that npm 10 then reports as
          # missing, so `npm ci` fails on an older runner for a lockfile that is
          # correct. Keeping the runner on the same major removes the whole class.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
