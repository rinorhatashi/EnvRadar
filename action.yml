name: "EnvRadar"
description: "Check that every environment variable your code reads is configured in every environment, and comment the report on the PR."
author: "Rinor Hatashi"

branding:
  icon: "shield"
  color: "green"

inputs:
  working-directory:
    description: "Directory to scan."
    required: false
    default: "."
  config:
    description: "Path to an envradar.yml config file (optional)."
    required: false
    default: ""
  fail-on:
    description: "Comma-separated statuses that fail the job: missing, parity, dead, none. Overrides envradar.yml."
    required: false
    default: ""
  comment:
    description: "Post/update the report as a pull-request comment."
    required: false
    default: "true"
  version:
    description: "Version of the envradar npm package to run."
    required: false
    default: "latest"
  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run EnvRadar
      id: envradar
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        VERSION: ${{ inputs.version }}
      run: |
        set +e
        REPORT="$RUNNER_TEMP/envradar-report.md"

        ARGS=(scan "$WORKING_DIRECTORY")
        [ -n "$CONFIG" ] && ARGS+=(--config "$CONFIG")
        [ -n "$FAIL_ON" ] && ARGS+=(--fail-on "$FAIL_ON")

        # Human-readable output into the job log; its exit code is the verdict.
        npx --yes "envradar@$VERSION" "${ARGS[@]}" --no-color
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

        # Markdown report for the PR comment.
        npx --yes "envradar@$VERSION" "${ARGS[@]}" --format markdown --output "$REPORT"
        echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"

    - name: Comment report on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.envradar.outputs.report_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const file = process.env.REPORT_PATH;
          if (!file || !fs.existsSync(file)) {
            core.info('No EnvRadar report to post.');
            return;
          }
          const body = fs.readFileSync(file, 'utf8');
          const marker = '<!-- envradar-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce result
      if: ${{ steps.envradar.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "::error::EnvRadar found environment variable issues — see the report above or the PR comment."
        exit 1
