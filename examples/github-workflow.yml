# Copy this file to .github/workflows/envradar.yml in your repository to run
# EnvRadar on every pull request and post the report as a PR comment.
name: EnvRadar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  envradar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the report comment
    steps:
      - uses: actions/checkout@v4
      - uses: rinorhatashi/EnvRadar@v1
        with:
          working-directory: .
          # config: envradar.yml
          # fail-on: missing,parity
